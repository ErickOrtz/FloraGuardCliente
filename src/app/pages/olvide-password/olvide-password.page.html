<ion-content class="login-content">

  <ion-content class="login-content">
    <div class="login-container">
      <h1 class="app-title">Flora Guard</h1>

      <div class="login-header">
        <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <span>Olvidé mi contraseña</span>
      </div>

      <p class="subtitle">
        Ingrese su correo electrónico para restablecer su contraseña.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <ion-label class="field-label">Correo electrónico</ion-label>
        <ion-item class="input-item" lines="none">
          <ion-input
            placeholder="correo@ejemplo.com"
            formControlName="correo"
            autocomplete="email"
          ></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
          Ingrese un correo válido
        </ion-text>

        <div class="links">
          <a class="forgot" (click)="$event.preventDefault(); goToLogin()" href="#">Iniciar sesión</a>
        </div>

        <div class="register-row">
          <span>¿Nuevo usuario?</span>
          <a class="register" (click)="$event.preventDefault(); goToRegistrar()" href="#">Registrarse</a>
        </div>

        <ion-button
          class="login-btn"
          expand="block"
          type="submit"
          [disabled]="loading"
        >
          Restablecer
        </ion-button>

        <ion-text color="danger" class="error" *ngIf="errorMsg">
          {{ errorMsg }}
        </ion-text>
      </form>
    </div>
  </ion-content>
