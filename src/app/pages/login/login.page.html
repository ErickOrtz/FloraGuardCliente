<ion-content class="ion-padding login-content">
  <ion-alert
    [isOpen]="showErrorModal"
    header="Error de sesión"
    [message]="errorMsg"
    [buttons]="alertButtons"
    (didDismiss)="showErrorModal = false"
  ></ion-alert>
  <h1 class="app-title">Flora Guard</h1>
  <div class="login-header">
    <ion-icon name="person-circle-outline"></ion-icon>
    <span>Iniciar Sesión</span>
  </div>
  <p class="subtitle">
    Ingrese el usuario y contraseña para continuar.
  </p>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-item lines="none" class="input-item">
      <ion-label position="stacked">Usuario</ion-label>
      <ion-input formControlName="username"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
      Usuario requerido
    </ion-text>

    <ion-item lines="none" class="input-item">
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      Contraseña requerida
    </ion-text>

    <div class="links">
      <a class="forgot" href="#">Olvide mi contraseña</a>
    </div>
    <div class="links">
      <span>¿Nuevo usuario?</span>
      <a class="register" href="#">Registrarse</a>
    </div>

    <ion-button expand="block" class="login-btn" type="submit" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Ingresar' }}
    </ion-button>
  </form>
</ion-content>
