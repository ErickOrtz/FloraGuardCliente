<ion-header>
  <ion-toolbar color="success">
    <ion-title>Arboles</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngFor="let arbol of arboles">
    <img [src]="'assets/pino.jpg'" />

    <ion-card-header>
      <ion-card-title>{{ arbol.idEspecie.nombreComun }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      {{ arbol.descripcion }}

      <div class="adoptar">
        <ion-button size="small" color="success" fill="outline">
          Adopt me
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="leaf-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
