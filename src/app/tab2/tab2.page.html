<ion-header>
  <ion-toolbar color="success">
    <ion-title>Mis Árboles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngFor="let arbol of arboles" (click)="verDetalle(arbol)">
    <img src="assets/pino.jpg" />

    <ion-card-header>
      <ion-card-title>
        {{ arbol.idEspecie.nombreComun }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      {{ arbol.descripcion }}
    </ion-card-content>
  </ion-card>

</ion-content>
